<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>

    <linearGradient id="pulse-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.45"/>
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" opacity="0.3"/>
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes streamData {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatSlow 7s ease-in-out infinite 1s;
      }
      .floating-card-3 {
        animation: floatSlow 5.5s ease-in-out infinite 2s;
      }
      .glow-orb-1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 8s ease-in-out infinite;
      }
      .glow-orb-2 {
        transform-origin: 1000px 320px;
        animation: pulseGlow 9s ease-in-out infinite 2s;
      }
      .stream-line {
        stroke-dasharray: 8 16;
        animation: streamData 3s linear infinite;
      }
      .stream-line-rev {
        stroke-dasharray: 6 12;
        animation: streamData 4s linear infinite reverse;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Grid Pattern Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#tech-grid)"/>

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <circle class="glow-orb-1" cx="220" cy="90" r="130" fill="#6366f1" opacity="0.22" filter="url(#glow-purple)"/>
  <circle class="glow-orb-2" cx="980" cy="310" r="140" fill="#06b6d4" opacity="0.2" filter="url(#glow-cyan)"/>
  <circle cx="600" cy="40" r="90" fill="#3b82f6" opacity="0.12" filter="url(#glow-cyan)"/>

  <!-- Dynamic Animated Circuit/Telemetry Connections (Background/Midground) -->
  <g opacity="0.6">
    <path class="stream-line" d="M 80 340 L 320 340 L 400 370 L 800 370 L 880 340 L 1120 340" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <path class="stream-line-rev" d="M 120 70 L 360 70 L 440 40 L 760 40 L 840 70 L 1080 70" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <line class="stream-line" x1="160" y1="210" x2="310" y2="210" stroke="#38bdf8" stroke-width="1.2"/>
    <line class="stream-line" x1="890" y1="210" x2="1040" y2="210" stroke="#a78bfa" stroke-width="1.2"/>
  </g>

  <!-- Floating Dynamic Tech Cards / Metrics (Left & Right Flanks) -->
  <!-- Left Side: Real Device Cloud Telemetry -->
  <g class="floating-card-1" filter="url(#subtle-shadow)">
    <rect x="50" y="145" width="185" height="130" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="65" y="162" width="28" height="28" rx="6" fill="#0284c7" opacity="0.2"/>
    <circle cx="79" cy="176" r="6" fill="#38bdf8"/>
    <text x="102" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.5">DEVICE FARM</text>
    <text x="65" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">100% Isolated</text>
    <text x="65" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#34d399">⚡ Dedicated Hardware</text>
    <text x="65" y="253" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">ADB • WDA • WebRTC</text>
  </g>

  <!-- Right Side: Low Latency / Parallel Execution Card -->
  <g class="floating-card-2" filter="url(#subtle-shadow)">
    <rect x="965" y="145" width="185" height="130" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="980" y="162" width="28" height="28" rx="6" fill="#7c3aed" opacity="0.2"/>
    <polygon points="994,166 987,178 993,178 991,186 1001,174 995,174" fill="#a855f7"/>
    <text x="1016" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.5">PERFORMANCE</text>
    <text x="980" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">&lt; 15ms Latency</text>
    <text x="980" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#38bdf8">🚀 60 FPS Video Stream</text>
    <text x="980" y="253" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Appium • Playwright • CI</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle, Feature Badges -->
  <!-- Top Category Pill Tag -->
  <g filter="url(#subtle-shadow)">
    <rect x="445" y="72" width="310" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="463" cy="87" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="477" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1">ENTERPRISE TESTING INFRASTRUCTURE</text>
  </g>

  <!-- Main Hero Title (Always crisp in foreground) -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#title-grad)" letter-spacing="-0.5" filter="url(#subtle-shadow)">
    Awesome Enterprise Device Cloud
  </text>

  <!-- Subtitle (Clear and readable) -->
  <text x="600" y="206" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0" letter-spacing="0.2">
    High-Performance Real Device Farms • Dedicated Hardware • Self-Hosted Stacks
  </text>

  <!-- Secondary Descriptive Line -->
  <text x="600" y="234" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Curated SaaS Platforms, Private Device Clouds, On-Premise Labs &amp; Open-Source Automation Frameworks
  </text>

  <!-- Interactive/Structured Feature Badges in Foreground -->
  <g transform="translate(270, 275)" filter="url(#subtle-shadow)">
    <!-- Badge 1: Real Mobile Devices -->
    <rect x="0" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="14" y="22" font-size="14">📱</text>
    <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">iOS &amp; Android</text>

    <!-- Badge 2: Enterprise Isolation -->
    <rect x="160" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="174" y="22" font-size="14">🔒</text>
    <text x="196" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Zero Data Egress</text>

    <!-- Badge 3: Self-Hosted & OSS -->
    <rect x="340" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="354" y="22" font-size="14">⚡</text>
    <text x="376" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Self-Hosted OSS</text>

    <!-- Badge 4: Automated CI/CD -->
    <rect x="515" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="529" y="22" font-size="14">🤖</text>
    <text x="551" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Appium &amp; CI/CD</text>
  </g>

  <!-- Bottom Accent Border Glow -->
  <line x1="200" y1="416" x2="1000" y2="416" stroke="url(#title-grad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
